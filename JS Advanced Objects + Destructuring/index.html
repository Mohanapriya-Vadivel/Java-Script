<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 12 JS Advanced Objects</title>
    <style>
        /* CSS: Day 12 styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0fff0; /* Honeydew background */
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        .output {
            background-color: #e6ffe6; /* Light green box */
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #b3ffb3;
        }
        button {
            margin-top: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Day 12: Advanced Objects + Destructuring</h1>

    <!-- Output section -->
    <div class="output" id="jsOutput">Click the button to see Object Destructuring!</div>

    <button id="objBtn">Show Object Info</button>

    <script>
        // ======= Day 12 JS =======

        // 1. Declare a nested object
        const person = {
            name: "Priya",
            age: 22,
            city: "Coimbatore",
            skills: {
                programming: "JavaScript",
                singing: "Classical",
                sports: "Badminton"
            }
        };

        // 2. Select output div and button
        const outputDiv = document.getElementById("jsOutput");
        const objBtn = document.getElementById("objBtn");

        // 3. Function to display object info using destructuring
        const showObjectInfo = () => {

            // Object destructuring
            const { name, age, city, skills } = person;
            const { programming, singing, sports } = skills;

            // Combine output for webpage
            const output = 
                `Name: ${name}<br>` +
                `Age: ${age}<br>` +
                `City: ${city}<br>` +
                `Skills:<br>` +
                `- Programming: ${programming}<br>` +
                `- Singing: ${singing}<br>` +
                `- Sports: ${sports}`;

            // Display on webpage
            outputDiv.innerHTML = output;

            // Console debugging
            console.log("Person Object:", person);
            console.log("Destructured Name:", name);
            console.log("Programming Skill:", programming);
        };

        // 4. Button click event
        objBtn.addEventListener("click", showObjectInfo);

    </script>

</body>
</html>
